/alpha_rise/voxel_log_odds_visualizer:
  ros__parameters:
      # Volume of individual voxel. (voxel_resolution)^3
      voxel_resolution: 1.0
      
      # Volume of the voxel map. (grid_size)^3
      grid_size: 200.0

      # Min logodds value to clip at.
      logodds_min: -20.0

      # Max logodds value to clip at.
      logodds_max: 20.0

      # Frame of the map
      frame_id: "alpha_rise/odom"
      
      # Only the voxels above this probablity is visualized
      probability_threshold: 0.8

      # Pointcloud topic to subscribe
      sub_pointcloud_topic:  "/alpha_rise/fls/pointcloud/post"
      
      # Marker topic to publish
      pub_marker_topic: "/alpha_rise/voxel_map"